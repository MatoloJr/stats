[package]
name = "stats-win"
version = "0.1.0"
edition = "2021"
description = "Stats for Windows: a light floating system monitor that warns before memory or storage runs out"
license = "MIT"
publish = false

[lib]
name = "stats_core"
path = "src/lib.rs"

[[bin]]
name = "stats"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding stays on so a bug in one handler is caught and logged instead of
# taking the whole monitor down.
panic = "unwind"
