# Stats settings spec: the default of every setting that more than one app has.
#
# Key names are the same on every platform (GSettings keys on Linux,
# %APPDATA%\Stats\config.ini on Windows). CI checks each app against this file:
#   Linux    node shared/check-spec.mjs   (reads linux/schemas/*.gschema.xml)
#   Windows  cargo test -p stats-core     (reads core::config::Config::default)
# Change a default here and in the app together, or CI fails.
#
# [shared] holds values every app must agree on. A platform section holds
# values that are deliberately different there; a key may appear in [shared]
# or in platform sections, never both. Lists are comma separated.

[shared]
poll-interval-ms = 1000
temperature-unit = celsius
collapsed-sections =

[linux]
bar-metrics = cpu, memory, storage, gpu, temperature, refresh
history-seconds = 60
pressure-notifications = false
cpu-warning = 70
cpu-critical = 90
memory-warning = 70
memory-critical = 90
storage-warning = 70
storage-critical = 90
gpu-warning = 70
gpu-critical = 90
temp-warning = 75
temp-critical = 90

[windows]
bar-metrics = cpu, memory, commit, storage, gpu, temperature, network
history-seconds = 120
pressure-notifications = true
cpu-warning = 90
cpu-critical = 98
memory-warning = 85
memory-critical = 95
commit-warning = 80
commit-critical = 92
storage-warning = 85
storage-critical = 95
gpu-warning = 90
gpu-critical = 98
temp-warning = 85
temp-critical = 95
