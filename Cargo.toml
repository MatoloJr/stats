[workspace]
resolver = "2"
members = ["core", "windows"]

[workspace.package]
# Keep in step with the VERSION file (checked by CI).
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MatoloJr/stats"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding stays on so a bug in one handler is caught and logged instead of
# taking the whole monitor down.
panic = "unwind"
