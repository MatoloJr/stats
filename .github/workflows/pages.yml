# Deploys the download site (html/) with the installers next to it, so
#   https://matolojr.github.io/stats/install.sh  and  .../install.ps1
# always serve the scripts from main. One-time setup: Settings > Pages >
# Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["html/**", "linux/install.sh", "windows/install.ps1", "windows/uninstall.ps1", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r html/. _site/
          cp linux/install.sh windows/install.ps1 windows/uninstall.ps1 _site/
          cp VERSION _site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
